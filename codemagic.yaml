workflows:
  my-workflow:
    name: Android Build
    environment:
      flutter: stable
    scripts:
      - name: Generate Android files
        script: flutter create . --platforms=android
      - name: Build App
        script: DART_CLI_OPTIONS="--enable-experiment=dot-shorthands" flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      
